name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Prisma 7 and some test suites construct clients at load time and only
      # require the variable to be present (no connection is made in CI).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zentra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      # Applies pending migrations to the live database on main pushes only
      # (never on PRs — unreviewed migrations must not touch prod). Requires
      # a `DATABASE_URL` repository secret (Settings > Secrets and variables
      # > Actions) holding the pooler connection string. Fails loudly when
      # the secret is missing so setup is never silently skipped.
      - name: Deploy database migrations (main pushes only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_URL secret is not set. Add the pooler connection string under Settings > Secrets and variables > Actions."
            exit 1
          fi
          npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run typecheck
      - run: npm test --if-present
      - run: npm run build

  frontend:
    name: Frontend (typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run lint
      - run: npm run build
