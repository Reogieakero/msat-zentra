name: zentra_mobile
description: "Zentra mobile for Advisers and Subject Teachers — reuses the same Express + Prisma API as the Next.js web app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  uuid: ^4.4.0
  intl: ^0.19.0
  connectivity_plus: ^6.1.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  share_plus: ^11.0.0
  signature: ^6.1.0
  path_provider: ^2.1.4
  pdfrx: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/zentra.png"
  adaptive_icon_foreground: "assets/zentra_fg.png"
  adaptive_icon_background: "#1C1C1C"
  web:
    generate: true
    image_path: "assets/zentra.png"
    background_color: "#1C1C1C"
    theme_color: "#1C1C1C"
  windows:
    generate: true
    image_path: "assets/zentra.png"
  macos:
    generate: true
    image_path: "assets/zentra.png"

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#1C1C1C"
  image: assets/zentra.png
  image_dark: assets/zentra_fg.png
  android: true
  ios: true
  web: true
